<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>laberin.io</title>
<style>
html, body { margin: 0; overflow: hidden; background: #101010; font-family: monospace; }
canvas { display: block; image-rendering: pixelated; }
#hud {
position: fixed; top: 10px; left: 10px; z-index: 100; color: white;
background: rgba(0, 0, 0, 0.45); border: 1px solid #444; padding: 8px; min-width: 160px; font-size: 8px;
}
#settings-btn {
position: fixed; top: 10px; right: 10px; z-index: 130; width: 42px; height: 42px;
border-radius: 50%; border: 1px solid #555; background: rgba(0, 0, 0, 0.65);
color: #fff; font-size: 10px; cursor: pointer; line-height: 1; padding: 0;
}
#settings-menu {
position: fixed; top: 62px; right: 10px; z-index: 125; color: white;
background: rgba(0, 0, 0, 0.65); border: 1px solid #444; padding: 8px; min-width: 176px; display: none; font-size: 8px;
}
#title { color: #7df9ff; font-weight: bold; margin-bottom: 6px; }
button { width: 100%; margin-top: 6px; background: #222; color: white; border: 1px solid #555; padding: 6px; cursor: pointer; font-family: monospace; font-size: 8px; }
button:hover { background: #333; }
#joystick-zone {
position: fixed; left: 20px; bottom: 20px; width: 140px; height: 140px; border-radius: 50%;
background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.25); z-index: 120;
touch-action: none; display: none;
}
#joystick-knob {
position: absolute; width: 58px; height: 58px; left: 41px; top: 41px; border-radius: 50%;
background: rgba(125, 249, 255, 0.65); border: 1px solid rgba(255, 255, 255, 0.5); pointer-events: none;
}
@media (pointer: fine) { #joystick-zone { display: none !important; } }

@media (pointer: coarse) {
#hud { top: 6px; left: 6px; padding: 6px; min-width: 130px; font-size: 7px; }
#settings-btn { top: 6px; right: 6px; width: 36px; height: 36px; font-size: 14px; }
#settings-menu { top: 46px; right: 6px; min-width: 150px; font-size: 7px; }
button { font-size: 7px; }
#joystick-zone { width: 120px; height: 120px; left: 14px; bottom: 14px; }
#joystick-knob { width: 50px; height: 50px; left: 35px; top: 35px; }
}
</style>
</head>
<body>
<button id="settings-btn" aria-label="Settings">⚙</button>

<div id="hud">
<div id="title">laberin.io</div>
<div>Stage: <span id="stage">1</span></div>
<div style="margin-top:6px;">WASD / Arrow Keys</div>
<div style="margin-top:4px;">Key: <span id="key-status">Not found</span></div>
</div>

<div id="settings-menu">
<button onclick="restartMap()">Restart Current Map</button>
<button onclick="resetGame()">Reset Entire Save</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/pixi.js@7.x/dist/pixi.min.js"></script>
<script>
const app = new PIXI.Application({ resizeTo: window, background: "#101010", antialias: false });
document.body.appendChild(app.view);

const TILE = 40;
const PLAYER_RADIUS = 8;
const CAMERA_ZOOM = 1.25;

let stageLevel = 1;
let mazeW = 15;
let mazeH = 15;
let maze = [];

const keys = {};
const mobileInput = { active: false, dx: 0, dy: 0, pointerId: null };

window.addEventListener("keydown", e => { keys[e.key.toLowerCase()] = true; });
window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

const player = { x: 0, y: 0, speed: 1.4 };
const chaser = { x: 0, y: 0, radius: 10, speedFactor: 1 / 3 };
const spawn = { x: 0, y: 0 };
const exit = { x: 0, y: 0 };
const keyItem = { x: 0, y: 0, collected: false };

const world = new PIXI.Container();
world.scale.set(CAMERA_ZOOM);
app.stage.addChild(world);

const playerGraphic = new PIXI.Graphics();
const exitGraphic = new PIXI.Graphics();
const keyGraphic = new PIXI.Graphics();
const chaserGraphic = new PIXI.Graphics();

const darkness = new PIXI.Graphics();
darkness.blendMode = PIXI.BLEND_MODES.NORMAL;
app.stage.addChild(darkness);

const warningHud = document.createElement("div");
warningHud.id = "warning-hud";
warningHud.style.cssText = "position:fixed;top:20px;left:50%;z-index:140;color:#ffffff;font-family:monospace;text-align:center;letter-spacing:1px;pointer-events:none;";
warningHud.innerHTML = `<div id="warning-title" style="font-size: 10px;line-height:1.1;">SOMETHING IS APPROACHING</div><div id="distance-text" style="font-size: 8px;margin-top:8px;">DISTANCE: [000]m</div>`;
document.body.appendChild(warningHud);
const warningTitle = document.getElementById("warning-title");
const distanceText = document.getElementById("distance-text");

function saveGame() {
localStorage.setItem("laberin-save", JSON.stringify({ stageLevel, mazeW, mazeH }));
}

function loadGame() {
const data = localStorage.getItem("laberin-save");
if (!data) return;
try {
const save = JSON.parse(data);
stageLevel = save.stageLevel || 1;
mazeW = save.mazeW || 15;
mazeH = save.mazeH || 15;
} catch (e) {}
}

function resetGame() {
localStorage.removeItem("laberin-save");
stageLevel = 1;
mazeW = 15;
mazeH = 15;
generateMaze(mazeW, mazeH);
buildWorld();
}

function restartMap() {
player.x = spawn.x;
player.y = spawn.y;
chaser.x = exit.x;
chaser.y = exit.y;
const farthest = findFarthestOpenTile(1, 1);
const keyTile = findRandomOpenTile([{ x: 1, y: 1 }, { x: farthest.x, y: farthest.y }]);
keyItem.x = keyTile.x * TILE + TILE / 2;
keyItem.y = keyTile.y * TILE + TILE / 2;
keyItem.collected = false;
document.getElementById("key-status").innerText = "Not found";
}

function findFarthestOpenTile(startX, startY) {
const visited = Array.from({ length: mazeH }, () => Array(mazeW).fill(false));
const queue = [{ x: startX, y: startY, d: 0 }];
visited[startY][startX] = true;
let farthest = queue[0];
let qi = 0;

while (qi < queue.length) {
const cur = queue[qi++];
if (cur.d > farthest.d) farthest = cur;
const nexts = [[cur.x + 1, cur.y], [cur.x - 1, cur.y], [cur.x, cur.y + 1], [cur.x, cur.y - 1]];
for (const [nx, ny] of nexts) {
if (nx < 0 || ny < 0 || nx >= mazeW || ny >= mazeH || visited[ny][nx] || maze[ny][nx] !== 0) continue;
visited[ny][nx] = true;
queue.push({ x: nx, y: ny, d: cur.d + 1 });
}
}
return farthest;
}

function findRandomOpenTile(exclude = []) {
const banned = new Set(exclude.map(p => `${p.x},${p.y}`));
const openTiles = [];
for (let y = 0; y < mazeH; y++) {
for (let x = 0; x < mazeW; x++) {
if (maze[y][x] !== 0) continue;
const key = `${x},${y}`;
if (!banned.has(key)) openTiles.push({ x, y });
}
}
if (openTiles.length === 0) return { x: 1, y: 1 };
return openTiles[Math.floor(Math.random() * openTiles.length)];
}

function generateMaze(w, h) {
maze = [];
for (let y = 0; y < h; y++) {
maze[y] = [];
for (let x = 0; x < w; x++) maze[y][x] = 1;
}

function carve(cx, cy) {
const dirs = [[0, -2], [2, 0], [0, 2], [-2, 0]];
dirs.sort(() => Math.random() - 0.5);
for (const [dx, dy] of dirs) {
const nx = cx + dx;
const ny = cy + dy;
if (nx > 0 && ny > 0 && nx < w - 1 && ny < h - 1 && maze[ny][nx] === 1) {
maze[ny][nx] = 0;
maze[cy + dy / 2][cx + dx / 2] = 0;
carve(nx, ny);
}
}
}

maze[1][1] = 0;
carve(1, 1);

spawn.x = TILE * 1.5;
spawn.y = TILE * 1.5;
player.x = spawn.x;
player.y = spawn.y;

const farthest = findFarthestOpenTile(1, 1);
exit.x = farthest.x * TILE + TILE / 2;
exit.y = farthest.y * TILE + TILE / 2;
chaser.x = exit.x;
chaser.y = exit.y;

const keyTile = findRandomOpenTile([{ x: 1, y: 1 }, { x: farthest.x, y: farthest.y }]);
keyItem.x = keyTile.x * TILE + TILE / 2;
keyItem.y = keyTile.y * TILE + TILE / 2;
keyItem.collected = false;
document.getElementById("key-status").innerText = "Not found";
}

function buildWorld() {
world.removeChildren();
for (let y = 0; y < mazeH; y++) {
for (let x = 0; x < mazeW; x++) {
const g = new PIXI.Graphics();
if (maze[y][x] === 1) {
g.beginFill(0x2d2d2d);
g.drawRect(0, 0, TILE, TILE);
g.beginFill(0x404040);
for (let py = 0; py < TILE; py += 8) for (let px = 0; px < TILE; px += 8) g.drawRect(px, py, 3, 3);
} else {
g.beginFill(0x1a1a1a);
g.drawRect(0, 0, TILE, TILE);
g.beginFill(0x242424);
for (let py = 0; py < TILE; py += 8) for (let px = 0; px < TILE; px += 8) g.drawRect(px, py, 1, 1);
}
g.endFill();
g.x = x * TILE;
g.y = y * TILE;
world.addChild(g);
}
}
world.addChild(exitGraphic);
world.addChild(keyGraphic);
world.addChild(chaserGraphic);
world.addChild(playerGraphic);
}

function drawPlayer() {
playerGraphic.clear();
playerGraphic.beginFill(0xffffff);
playerGraphic.drawCircle(0, 0, PLAYER_RADIUS);
playerGraphic.beginFill(0x7df9ff);
playerGraphic.drawRect(-3, -3, 3, 3);
playerGraphic.endFill();
playerGraphic.x = player.x;
playerGraphic.y = player.y;
}

function drawExit() {
exitGraphic.clear();
exitGraphic.beginFill(keyItem.collected ? 0x66ff88 : 0x446655);
exitGraphic.drawRect(-8, -8, 16, 16);
exitGraphic.endFill();
exitGraphic.x = exit.x;
exitGraphic.y = exit.y;
}


function drawKeyItem() {
keyGraphic.clear();
if (keyItem.collected) {
keyGraphic.visible = false;
return;
}
keyGraphic.visible = true;
keyGraphic.beginFill(0xffdd55);
keyGraphic.drawCircle(0, 0, 6);
keyGraphic.beginFill(0x101010);
keyGraphic.drawCircle(0, 0, 2.5);
keyGraphic.beginFill(0xffdd55);
keyGraphic.drawRect(4, -2, 10, 4);
keyGraphic.drawRect(11, -2, 2, 6);
keyGraphic.drawRect(8, -2, 2, 5);
keyGraphic.endFill();
keyGraphic.x = keyItem.x;
keyGraphic.y = keyItem.y;
}

function isWall(px, py) {
const tx = Math.floor(px / TILE);
const ty = Math.floor(py / TILE);
if (tx < 0 || ty < 0 || tx >= mazeW || ty >= mazeH) return true;
return maze[ty][tx] === 1;
}

function drawChaser() {
chaserGraphic.clear();
chaserGraphic.beginFill(0xff2222);
chaserGraphic.drawCircle(0, 0, chaser.radius);
chaserGraphic.beginFill(0xffa0a0);
chaserGraphic.drawRect(-2, -2, 2, 2);
chaserGraphic.endFill();
chaserGraphic.x = chaser.x;
chaserGraphic.y = chaser.y;
}

function moveChaser() {
const dx = player.x - chaser.x;
const dy = player.y - chaser.y;
const len = Math.hypot(dx, dy);
if (len === 0) return;
const speed = player.speed * chaser.speedFactor;
chaser.x += (dx / len) * speed;
chaser.y += (dy / len) * speed;
}

function drawDarkness() {
const spotlightRadius = 160;
const px = player.x * CAMERA_ZOOM + world.x;
const py = player.y * CAMERA_ZOOM + world.y;
darkness.clear();
darkness.beginFill(0x000000, 0.88);
darkness.drawRect(0, 0, app.screen.width, app.screen.height);
darkness.endFill();

darkness.beginHole();
darkness.drawCircle(px, py, spotlightRadius);
darkness.endHole();

darkness.lineStyle(0);
for (let r = spotlightRadius + 6; r < spotlightRadius + 52; r += 8) {
const alpha = Math.max(0, 0.12 - (r - spotlightRadius) * 0.0022);
darkness.beginFill(0xffffff, alpha);
darkness.drawCircle(px, py, r);
darkness.endFill();
}
}

function updateWarning() {
const distPx = Math.hypot(player.x - chaser.x, player.y - chaser.y);
const distMeters = Math.max(0, Math.floor(distPx / TILE * 10));
const dangerT = Math.max(0, Math.min(1, (150 - distMeters) / 100));
const color = `rgb(255, ${Math.floor(255 - 120 * dangerT)}, ${Math.floor(255 - 120 * dangerT)})`;
const titleSize = (20 + dangerT * 34) * 0.5;
const distSize = (16 + dangerT * 24) * 0.5;
const glow = 4 + 14 * dangerT;
warningTitle.style.color = color;
distanceText.style.color = color;
warningTitle.style.fontSize = `${titleSize}px`;
distanceText.style.fontSize = `${distSize}px`;
warningTitle.style.textShadow = `0 0 ${glow}px rgba(255,80,80, ${0.3 + 0.5 * dangerT})`;
distanceText.style.textShadow = `0 0 ${glow}px rgba(255,80,80, ${0.3 + 0.5 * dangerT})`;

if (distMeters <= 50) {
const shakePower = (50 - distMeters) / 50;
const sx = (Math.random() - 0.5) * 10 * shakePower;
const sy = (Math.random() - 0.5) * 8 * shakePower;
warningHud.style.transform = `translateX(-50%) translate(${sx}px, ${sy}px)`;
} else {
warningHud.style.transform = "translateX(-50%)";
}
distanceText.textContent = `DISTANCE: [${String(distMeters).padStart(3, "0")}]m`;
}

function movePlayer() {
let dx = 0, dy = 0;
if (keys["w"] || keys["arrowup"]) dy -= 1;
if (keys["s"] || keys["arrowdown"]) dy += 1;
if (keys["a"] || keys["arrowleft"]) dx -= 1;
if (keys["d"] || keys["arrowright"]) dx += 1;
dx += mobileInput.dx;
dy += mobileInput.dy;

const lenRaw = Math.hypot(dx, dy);
const len = Math.min(1, lenRaw);
if (len > 0) { dx /= lenRaw; dy /= lenRaw; }

const speed = player.speed;
const nx = player.x + dx * speed * len;
const ny = player.y + dy * speed * len;
const pad = 7;

if (!isWall(nx - pad, player.y - pad) && !isWall(nx + pad, player.y - pad) && !isWall(nx - pad, player.y + pad) && !isWall(nx + pad, player.y + pad)) player.x = nx;
if (!isWall(player.x - pad, ny - pad) && !isWall(player.x + pad, ny - pad) && !isWall(player.x - pad, ny + pad) && !isWall(player.x + pad, ny + pad)) player.y = ny;
}

function cameraFollow() {
const tx = app.screen.width / 2 - player.x * CAMERA_ZOOM;
const ty = app.screen.height / 2 - player.y * CAMERA_ZOOM;
world.x += (tx - world.x) * 0.08;
world.y += (ty - world.y) * 0.08;
}

function checkKeyPickup() {
if (keyItem.collected) return;
const dist = Math.hypot(player.x - keyItem.x, player.y - keyItem.y);
if (dist < 18) {
keyItem.collected = true;
document.getElementById("key-status").innerText = "Acquired";
}
}

function checkExit() {
if (!keyItem.collected) return;
const dist = Math.hypot(player.x - exit.x, player.y - exit.y);
if (dist < 18) {
stageLevel ++;
document.getElementById("stage").innerText = stageLevel;
mazeW += 4; mazeH += 4;
if (mazeW % 2 === 0) mazeW ++;
if (mazeH % 2 === 0) mazeH ++;
saveGame();
generateMaze(mazeW, mazeH);
buildWorld();
}
}

function checkCaught() {
const dist = Math.hypot(player.x - chaser.x, player.y - chaser.y);
if (dist <= PLAYER_RADIUS + chaser.radius) restartMap();
}

function update() {
movePlayer();
moveChaser();
cameraFollow();
drawPlayer();
drawExit();
drawKeyItem();
drawChaser();
drawDarkness();
updateWarning();
checkCaught();
checkKeyPickup();
checkExit();
}

function setupSettingsMenu() {
const settingsBtn = document.getElementById("settings-btn");
const menu = document.getElementById("settings-menu");
settingsBtn.addEventListener("click", () => {
menu.style.display = menu.style.display === "block" ? "none" : "block";
});
window.addEventListener("keydown", e => { if (e.key === "Escape") menu.style.display = "none"; });
}

function setupJoystick() {
const coarsePointerQuery = window.matchMedia("(pointer: coarse)");
if (!coarsePointerQuery.matches) return;

const zone = document.createElement("div");
zone.id = "joystick-zone";
const knob = document.createElement("div");
knob.id = "joystick-knob";
zone.appendChild(knob);
document.body.appendChild(zone);
zone.style.display = "none";

const maxR = 45;

function updateKnob(clientX, clientY) {
const rect = zone.getBoundingClientRect();
const centerX = rect.width / 2;
const centerY = rect.height / 2;
let dx = clientX - (rect.left + centerX);
let dy = clientY - (rect.top + centerY);
const len = Math.hypot(dx, dy);
if (len > maxR) { dx = (dx / len) * maxR; dy = (dy / len) * maxR; }
const knobHalfX = knob.clientWidth / 2;
const knobHalfY = knob.clientHeight / 2;
knob.style.left = `${centerX + dx - knobHalfX}px`;
knob.style.top = `${centerY + dy - knobHalfY}px`;
mobileInput.dx = dx / maxR;
mobileInput.dy = dy / maxR;
}

function centerKnob() {
knob.style.left = `${zone.clientWidth / 2 - knob.clientWidth / 2}px`;
knob.style.top = `${zone.clientHeight / 2 - knob.clientHeight / 2}px`;
}

function resetKnob() {
centerKnob();
zone.style.display = "none";
mobileInput.active = false;
mobileInput.dx = 0;
mobileInput.dy = 0;
mobileInput.pointerId = null;
}

function placeZone(clientX, clientY) {
const margin = 8;
const computed = window.getComputedStyle(zone);
const zoneW = parseFloat(computed.width) || zone.clientWidth;
const zoneH = parseFloat(computed.height) || zone.clientHeight;
const left = Math.max(margin, Math.min(window.innerWidth - zoneW - margin, clientX - zoneW / 2));
const top = Math.max(margin, Math.min(window.innerHeight - zoneH - margin, clientY - zoneH / 2));
zone.style.left = `${left}px`;
zone.style.top = `${top}px`;
zone.style.bottom = "auto";
}

window.addEventListener("pointerdown", e => {
if (!coarsePointerQuery.matches || !e.isPrimary) return;
if (e.clientX > window.innerWidth * 0.6) return;
placeZone(e.clientX, e.clientY);
zone.style.display = "block";
centerKnob();
mobileInput.active = true;
mobileInput.pointerId = e.pointerId;
zone.setPointerCapture(e.pointerId);
updateKnob(e.clientX, e.clientY);
});

window.addEventListener("pointermove", e => {
if (!mobileInput.active || e.pointerId !== mobileInput.pointerId) return;
updateKnob(e.clientX, e.clientY);
});

window.addEventListener("pointerup", e => {
if (e.pointerId !== mobileInput.pointerId) return;
resetKnob();
});

window.addEventListener("pointercancel", e => {
if (e.pointerId !== mobileInput.pointerId) return;
resetKnob();
});

coarsePointerQuery.addEventListener("change", e => {
if (!e.matches) resetKnob();
});
}

loadGame();
document.getElementById("stage").innerText = stageLevel;
generateMaze(mazeW, mazeH);
buildWorld();
setupSettingsMenu();
setupJoystick();
app.ticker.add(update);
</script>
</body>
</html>
